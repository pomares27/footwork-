<script>
const $=id=>document.getElementById(id);
const defaults={prep:5,work:60,rest:20,rounds:11,cycles:1,cycleRest:90,flash:.5,interval:2,repeat:true,signal:'flash',zones:[1,2,3,4,5,6,7,8]};
let c;try{c={...defaults,...JSON.parse(localStorage.getItem('footwork-v11')||'{}')}}catch{c={...defaults}}
if(!Array.isArray(c.zones))c.zones=[...defaults.zones];
const save=()=>{try{localStorage.setItem('footwork-v11',JSON.stringify(c))}catch{}};
const fmt=t=>{t=Math.max(0,Math.ceil(t));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const names={prep:'PREPÁRATE',work:'ENTRENAR',rest:'DESCANSAR',rounds:'RONDAS',cycles:'CICLOS',cycleRest:'DESCANSO ENTRE CICLOS',flash:'DURACIÓN DEL DESTELLO',interval:'INTERVALO ENTRE PUNTOS'};
const desc={prep:'Cuenta atrás antes de comenzar',work:'Duración de cada ronda',rest:'Descanso entre rondas',rounds:'Ejercicios por ciclo',cycles:'Número de bloques',cycleRest:'Recuperación entre bloques'};
const pts=[[48,98],[312,98],[48,190],[312,190],[48,340],[312,340],[48,495],[312,495]];
function court(mini=false){const vb=mini?'0 0 360 580':'0 0 360 580';return `<svg viewBox="${vb}" preserveAspectRatio="none" role="img" aria-label="Media pista de bádminton con ocho puntos"><defs><linearGradient id="courtblue" x2="0" y2="1"><stop stop-color="#0b4d95"/><stop offset="1" stop-color="#0962bb"/></linearGradient></defs><rect x="1" y="1" width="358" height="578" rx="6" fill="url(#courtblue)" stroke="#2a9cfa" stroke-width="2"/><g stroke="white" fill="none" stroke-width="3.4"><path d="M15 17H345V563H15Z M48 17V563 M312 17V563 M15 156H345 M15 500H345 M180 156V500"/><path d="M15 17H345" stroke-dasharray="9 8"/></g>${pts.map(([x,y],i)=>c.zones.includes(i+1)?`<g data-zone="${i+1}"><circle cx="${x}" cy="${y}" r="30" fill="#092440" stroke="white" stroke-width="4"/><circle class="lit" cx="${x}" cy="${y}" r="26" fill="#18c7ff" opacity="0"/>${mini?`<text x="${x}" y="${y+9}" font-size="28" text-anchor="middle" fill="white" font-family="system-ui">${i+1}</text>`:''}</g>`:'').join('')}</svg>`}
function renderHome(){$('roundsHome').textContent=c.rounds;$('cyclesHome').textContent=c.cycles;}
function renderZones(){$('mini').innerHTML=court(true);$('zonecount').textContent=c.zones.length+'/8';$('zonegrid').innerHTML=Array.from({length:8},(_,i)=>`<button data-zone="${i+1}" class="${c.zones.includes(i+1)?'active':''}">${i+1}</button>`).join('');document.querySelectorAll('#zonegrid button').forEach(b=>b.onclick=()=>{const n=+b.dataset.zone;c.zones=c.zones.includes(n)?c.zones.filter(v=>v!==n):[...c.zones,n].sort();save();renderZones()})}
function duration(){return c.prep+c.cycles*c.rounds*c.work+c.cycles*Math.max(0,c.rounds-1)*c.rest+Math.max(0,c.cycles-1)*c.cycleRest}
function renderSettings(){for(const id of Object.keys(names)){const el=document.querySelector(`[data-time="${id}"]`);if(el)el.textContent=['rounds','cycles'].includes(id)?c[id]:['flash','interval'].includes(id)?c[id].toFixed(1).replace('.',',')+' s':fmt(c[id])}document.querySelectorAll('[data-count]').forEach(el=>el.textContent=c[el.dataset.count]);$('repeat').checked=c.repeat;$('signal').value=c.signal;$('total').textContent=fmt(duration());renderZones()}
$('times').innerHTML=['prep','work','rest','rounds','cycles','cycleRest'].map((id,i)=>`<div class="setting"><span style="color:${['#ffe234','#76e955','#f24d49','#20b9ed','#ffe234','#ffe234'][i]};font-size:20px">●</span><div class="words"><strong>${names[id]}</strong><small>${desc[id]}</small></div><button class="value" data-time="${id}"></button></div>`).join('');
let wheelId=null;
function openWheel(id){wheelId=id;$('wheelTitle').textContent=names[id];$('wheels').innerHTML='';const count=['rounds','cycles'].includes(id),decimal=['flash','interval'].includes(id),v=c[id];const cols=count?[['count',Array.from({length:100},(_,i)=>i+1),v,'CANTIDAD']]:[['min',Array.from({length:120},(_,i)=>i),Math.floor(v/60),'MINUTOS'],['sec',Array.from({length:60},(_,i)=>i),Math.floor(v%60),'SEGUNDOS'],...(decimal?[['tenth',Array.from({length:10},(_,i)=>i),Math.round(v*10)%10,'DÉCIMAS']]:[])];for(const [key,values,selected,label] of cols){const col=document.createElement('div');col.className='wheelcol';col.innerHTML=`<label>${label}</label><div class="wheelview"><div class="wheel" data-key="${key}">${values.map(n=>`<button data-n="${n}" class="${n===selected?'chosen':''}">${String(n).padStart(2,'0')}</button>`).join('')}</div></div>`;$('wheels').appendChild(col);const wheel=col.querySelector('.wheel');requestAnimationFrame(()=>wheel.scrollTop=values.indexOf(selected)*52);wheel.addEventListener('scroll',()=>{const i=Math.max(0,Math.min(values.length-1,Math.round(wheel.scrollTop/52)));wheel.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('chosen',j===i))},{passive:true});wheel.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>wheel.scrollTo({top:i*52,behavior:'smooth'}))}$('wheelmask').classList.remove('hidden')}
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>openWheel(b.dataset.time));
$('cancel').onclick=()=>{$('wheelmask').classList.add('hidden')};$('done').onclick=()=>{const v={};document.querySelectorAll('.wheel').forEach(w=>{const i=Math.max(0,Math.min(w.children.length-1,Math.round(w.scrollTop/52)));v[w.dataset.key]=+w.children[i].dataset.n});let n=v.count??v.min*60+v.sec+(v.tenth||0)/10;c[wheelId]=Math.max(['rounds','cycles'].includes(wheelId)?1:wheelId==='flash'?.1:wheelId==='interval'?.2:0,n);save();renderSettings();$('wheelmask').classList.add('hidden')};

$('all').onclick=()=>{c.zones=[1,2,3,4,5,6,7,8];save();renderZones()};$('clear').onclick=()=>{c.zones=[];save();renderZones()};
$('gear').onclick=()=>{$('home').classList.add('hidden');$('settings').classList.remove('hidden');renderSettings()};$('back').onclick=()=>{$('settings').classList.add('hidden');$('home').classList.remove('hidden');renderHome()};
let run=null,raf=0,last=0;
function phase(p){run.phase=p;run.remaining=c[p==='cycleRest'?'cycleRest':p];run.duration=run.remaining;run.signalElapsed=0;run.lastZone=0;run.active=0;updatePhase()}
function updatePhase(){const resting=run.phase!=='work',label=run.phase==='prep'?'PREPÁRATE':run.phase==='cycleRest'?'DESCANSO ENTRE CICLOS':'DESCANSO';$('status').textContent=resting?label:'● ENTRENANDO';$('cyclelabel').textContent=`CICLO ${run.cycle} DE ${c.cycles}`;$('roundlabel').textContent=`RONDA ${run.round} DE ${c.rounds}`;for(const id of ['overlay','fullOverlay'])$(id).classList.toggle('hidden',!resting);$('phaseLabel').textContent=$('fullPhase').textContent=label;light(0)}
function light(n){for(const root of ['sessioncourt','fullcourt'])document.querySelectorAll(`#${root} [data-zone]`).forEach(g=>{g.querySelector('.lit').setAttribute('opacity',+g.dataset.zone===n?'1':'0');g.querySelector('circle').setAttribute('stroke',+g.dataset.zone===n?'#82efff':'white')})}
function pick(){const pool=c.zones.filter(n=>c.repeat||n!==run.lastZone);const a=pool.length?pool:c.zones;const n=a[Math.floor(Math.random()*a.length)];run.lastZone=n;run.active=n;light(n)}
function next(){if(run.phase==='prep'){phase('work');pick()}else if(run.phase==='work'){if(run.round<c.rounds)phase('rest');else if(run.cycle<c.cycles)phase('cycleRest');else{finish();return}}else if(run.phase==='rest'){run.round++;phase('work');pick()}else{run.cycle++;run.round=1;phase('work');pick()}}
function tick(t){if(!run)return;if(!last)last=t;const dt=Math.min(.25,(t-last)/1000);last=t;if(!run.paused){run.remaining-=dt;if(run.phase==='work'){run.signalElapsed+=dt;if(run.signalElapsed>=c.interval){run.signalElapsed%=c.interval;pick()}if(c.signal==='flash'&&run.signalElapsed>=c.flash)light(0)}if(run.remaining<=0)next()}if(!run)return;const txt=fmt(run.remaining);$('clock').textContent=$('overlayClock').textContent=$('fullClock').textContent=txt;raf=requestAnimationFrame(tick)}
function start(){if(!c.zones.length){alert('Selecciona al menos un punto en Ajustes.');return}if(c.work<=0){alert('Configura un tiempo de entrenamiento mayor que cero.');return}run={cycle:1,round:1,paused:false};$('home').classList.add('hidden');$('settings').classList.add('hidden');$('session').classList.remove('hidden');$('sessioncourt').innerHTML=court();$('fullcourt').innerHTML=court();phase(c.prep>0?'prep':'work');if(run.phase==='work')pick();last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function stop(){run=null;cancelAnimationFrame(raf);$('full').classList.add('hidden');$('session').classList.add('hidden');$('home').classList.remove('hidden');renderHome()}
function finish(){stop();alert('¡Entrenamiento completado!')}
function pause(){if(!run)return;run.paused=!run.paused;last=0;$('pause').textContent=$('fullPause').textContent=run.paused?'▶ Reanudar':'Ⅱ Pausar'}
$('play').onclick=$('startFromSettings').onclick=start;$('stop').onclick=$('fullStop').onclick=()=>{if(confirm('¿Detener el entrenamiento?'))stop()};$('pause').onclick=$('fullPause').onclick=pause;
$('expand').onclick=()=>{$('full').dataset.preview='false';$('fullPause').classList.remove('hidden');$('fullStop').classList.remove('hidden');$('full').classList.remove('hidden')};$('exit').onclick=()=>{$('full').classList.add('hidden');$('full').classList.remove('preview-only')};
$('previewExpand').onclick=()=>{if(!run){$('fullcourt').innerHTML=court();$('fullOverlay').classList.add('hidden');$('fullPause').classList.add('hidden');$('fullStop').classList.add('hidden');$('full').dataset.preview='true'}else{$('full').dataset.preview='false';$('fullPause').classList.remove('hidden');$('fullStop').classList.remove('hidden')} $('full').classList.remove('hidden')};
$('reset').onclick=()=>{if(confirm('¿Reiniciar el entrenamiento con los ajustes guardados?')){if(run)stop();renderHome()}};
renderSettings();renderHome();
</script></body></html>
